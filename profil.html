<!DOCTYPE html>
<html lang="id"> 
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal dan target olahraga saya</title> 
</head>
<body>

 
  <header>
    <h1>Jadwal dan target olahraga saya</h1>
    <nav aria-label="Navigasi utama">
      <ul>
        <li><a href="#jadwal">Jadwal Latihan</a></li>
        <li><a href="#catat">Catat Latihan</a></li>
      </ul>
    </nav>
  </header>

  
  <main>
    
    
    <section id="jadwal">
      <h2>Jadwal Latihan</h2>
      
      
      <table>
        <caption>Daftar jadwal olahraga mingguan</caption>
        <thead>
          <tr>
            
            <th scope="col">Hari</th>
            <th scope="col">Jenis Olahraga</th>
            <th scope="col">Durasi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Senin</th>
            <td>Lari</td>
            <td>30 Menit</td>
          </tr>
          <tr>
            <th scope="row">Rabu</th>
            <td>Renang</td>
            <td>45 Menit</td>
          </tr>
          <tr>
            <th scope="row">Jumat</th>
            <td>Bersepeda</td>
            <td>60 Menit</td>
          </tr>
        </tbody>
      </table>

      
      <figure>
        <img src="foto olahraga.avif" alt="Ilustrasi orang sedang berolahraga lari" width="640" height="360" loading="lazy">
        <figcaption>Fokus dan konsisten berolahraga.</figcaption>
      </figure>
    </section>

    
    <section id="catat">
      <h2>Catat Latihan</h2>
      
      
      <form action="/simpan" method="post">
        <p>
          <label for="jenis">Jenis:</label>
          <input type="text" id="jenis" name="jenis" required>
        </p>
        <p>
          <label for="tanggal">Tanggal:</label>
         
          <input type="date" id="tanggal" name="tanggal" required>
        </p>
        <p>
          <label for="durasi">Durasi (Menit):</label>
          
          <input type="number" id="durasi" name="durasi" min="1" required>
        </p>
        <button type="submit">Simpan</button>
      </form>
    </section>

  </main>

  
  <footer>

    <p>Muhammad Indra Kurniawan· 25523132 · 2026</p>
  </footer>

</body>
</html>
